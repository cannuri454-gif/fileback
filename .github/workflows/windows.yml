name: Windows tests and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Test
        run: |
          python -m coverage run --branch --source=fileback -m unittest discover -s tests -v
          python -m coverage report --fail-under=80
      - name: Check application source
        run: python -m bandit -r fileback run.py
      - name: Check larger fictional folder
        run: python tools/stress_check.py
      - name: Audit build dependencies
        run: python -m pip_audit -r requirements-build.txt -r requirements-dev.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Fileback run.py
      - name: Exercise packaged app
        run: |
          $env:FILEBACK_SELF_TEST_LOG = Join-Path $env:RUNNER_TEMP 'fileback-self-test.log'
          $process = Start-Process -FilePath 'dist/Fileback.exe' -ArgumentList '--self-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            if (Test-Path $env:FILEBACK_SELF_TEST_LOG) { Get-Content $env:FILEBACK_SELF_TEST_LOG }
            Stop-Process -Id $process.Id -Force
            throw 'Packaged self-test timed out.'
          }
          if (Test-Path $env:FILEBACK_SELF_TEST_LOG) { Get-Content $env:FILEBACK_SELF_TEST_LOG }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged self-test exited with $($process.ExitCode)." }
      - name: Diagnose failed executable startup
        if: failure()
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name FilebackDiagnostic run.py
          python -c "import subprocess; result = subprocess.run(['dist/FilebackDiagnostic.exe', '--self-test'], timeout=30); raise SystemExit(result.returncode)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fileback-Windows
          path: |
            dist/Fileback.exe
            LICENSE
            THIRD_PARTY.md
            licenses/
