[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileback-local"
version = "0.1.0"
description = "Local file history and safe recovery for your desktop"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Can Nuri"}]
dependencies = []

[project.gui-scripts]
fileback = "fileback.app:main"

[tool.setuptools.packages.find]
include = ["fileback*"]
