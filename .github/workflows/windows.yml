name: Windows tests and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Check application source
        run: python -m bandit -r fileback run.py
      - name: Audit build dependencies
        run: python -m pip_audit -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Fileback run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fileback-Windows
          path: dist/Fileback.exe
